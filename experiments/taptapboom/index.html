<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Planet Defender - Minimalist Mobile</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            touch-action: none;
            /* Disables standard double-tap to zoom or swipe gestures */
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #09090b;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #09090b;
        }

        canvas {
            display: block;
            background-color: #09090b;
            max-width: 100%;
            max-height: 100%;
        }

        /* Custom UI HUD overlays (Glassmorphic & Fluid) */
        .hud-text {
            position: absolute;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            pointer-events: none;
            font-size: clamp(11px, 2vw, 15px);
        }

        #scoreHUD {
            top: 15px;
            left: 15px;
            color: #38bdf8;
            background: rgba(15, 23, 42, 0.4);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        #highScoreHUD {
            top: 15px;
            right: 15px;
            color: #fbbf24;
            background: rgba(15, 23, 42, 0.4);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(251, 191, 36, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        #upgradesDock {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.4);
            padding: 4px 10px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            max-width: 50%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .upgrade-badge {
            font-size: 8px;
            font-weight: 800;
            padding: 3px 6px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 3px;
            opacity: 0.25;
            transition: all 0.2s ease;
        }

        .upgrade-badge.active {
            opacity: 1;
        }

        .badge-s {
            background: #ec4899;
            color: white;
            border: 1px solid #f472b6;
        }

        .badge-m {
            background: #3b82f6;
            color: white;
            border: 1px solid #60a5fa;
        }

        .badge-r {
            background: #10b981;
            color: white;
            border: 1px solid #34d399;
        }

        .badge-t {
            background: #0ea5e9;
            color: white;
            border: 1px solid #38bdf8;
        }

        .badge-d {
            background: #f43f5e;
            color: white;
            border: 1px solid #fb7185;
        }

        #healthHUD {
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            align-items: center;
            background: rgba(15, 23, 42, 0.4);
            padding: 8px 16px;
            border-radius: 15px;
            border: 1px solid rgba(239, 68, 68, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .heart {
            width: 14px;
            height: 14px;
            background-color: #ef4444;
            transform: rotate(-45deg);
            position: relative;
            display: inline-block;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.2);
        }

        .heart::before,
        .heart::after {
            content: "";
            width: 14px;
            height: 14px;
            background-color: #ef4444;
            border-radius: 50%;
            position: absolute;
        }

        .heart::before {
            top: -7px;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 7px;
        }

        .heart.lost {
            background-color: #27272a;
            transform: rotate(-45deg) scale(0.7);
        }

        .heart.lost::before,
        .heart.lost::after {
            background-color: #27272a;
        }

        /* Screen overlays */
        #menuOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(9, 9, 11, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        h1 {
            font-size: clamp(24px, 5.5vw, 54px);
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: 3px;
            font-weight: 900;
        }

        .tagline {
            font-size: clamp(11px, 2.2vw, 15px);
            color: #71717a;
            margin-bottom: 25px;
            max-width: 420px;
            line-height: 1.4;
        }

        .action-btn {
            background: #ffffff;
            color: #09090b;
            border: none;
            padding: 12px 32px;
            font-size: clamp(14px, 2.5vw, 18px);
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            outline: none;
        }

        .action-btn:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        .stats-summary {
            margin: 15px 0;
            color: #a1a1aa;
            font-size: clamp(14px, 2.5vw, 20px);
            line-height: 1.5;
            background: rgba(24, 24, 27, 0.4);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .high-score-popup {
            color: #fbbf24;
            font-weight: bold;
            animation: bounce 0.8s infinite alternate;
            margin-top: 4px;
            font-size: 13px;
        }

        @keyframes bounce {
            from {
                transform: scale(0.96);
            }

            to {
                transform: scale(1.04);
            }
        }

        .hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        /* Mobile landscape enforcement notification */
        #orientationWarning {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #09090b;
            color: white;
            z-index: 99;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 768px) and (orientation: portrait) {
            #orientationWarning {
                display: flex;
            }
        }
    </style>
</head>

<body>

    <div id="gameContainer">
        <!-- Canvas for Game Render -->
        <canvas id="gameCanvas"></canvas>

        <!-- Heads Up Display -->
        <div id="scoreHUD" class="hud-text">Score: 0</div>

        <div id="upgradesDock">
            <div id="badgeS" class="upgrade-badge badge-s">
                <span>S</span><span id="levelS">0</span>
            </div>
            <div id="badgeM" class="upgrade-badge badge-m">
                <span>M</span><span id="levelM">0</span>
            </div>
            <div id="badgeR" class="upgrade-badge badge-r">
                <span>R</span><span id="levelR">0</span>
            </div>
            <div id="badgeT" class="upgrade-badge badge-t">
                <span>T</span><span id="levelT">0</span>
            </div>
            <div id="badgeD" class="upgrade-badge badge-d">
                <span>D</span><span id="levelD">0</span>
            </div>
        </div>

        <div id="highScoreHUD" class="hud-text">High: 0</div>
        <div id="healthHUD" class="hud-text">
            <div id="heart1" class="heart"></div>
            <div id="heart2" class="heart"></div>
            <div id="heart3" class="heart"></div>
        </div>

        <!-- Overlays (Start/Game Over) -->
        <div id="menuOverlay">
            <h1 id="menuTitle">PLANET DEFENDER</h1>
            <p id="menuTagline" class="tagline">Tap screen, click or press Space to shoot. Destroy hazards and collect
                glowing gold shapes for defensive upgrades.</p>
            <div id="menuStats" class="stats-summary hidden">
                <div>Score: <span id="lastScoreVal" style="color:#38bdf8; font-weight:bold;">0</span></div>
                <div>High Score: <span id="highScoreVal" style="color:#fbbf24; font-weight:bold;">0</span></div>
                <div id="newHighScoreLabel" class="high-score-popup hidden">NEW SYSTEM RECORD!</div>
            </div>
            <button id="actionButton" class="action-btn">Initialize Core</button>
        </div>

        <!-- Orientation Helper -->
        <div id="orientationWarning">
            <svg style="width: 48px; height: 48px; fill: #ffffff; margin-bottom: 15px;" viewBox="0 0 24 24">
                <path
                    d="M16,1H8C6.34,1,5,2.34,5,4v16c0,1.66,1.34,3,3,3h8c1.66,0,3-1.34,3-3V4C19,2.34,17.66,1,16,1z M17,18H7V6h10V18z M11,4h2v1h-2V4z M11,20h2v1h-2V20z" />
                <path d="M0 0h24v24H0z" fill="none" />
            </svg>
            <h2 style="font-size: 18px; margin-bottom: 6px;">Rotate Your Device</h2>
            <p style="color: #71717a; font-size: 13px;">Planet Defender requires landscape mode on mobile.</p>
        </div>
    </div>

    <script>
        // --- SOUND GENERATION (Web Audio API) ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                initAudio();
                const now = audioCtx.currentTime;

                if (type === 'fire') {
                    // Modern clean high-to-low high frequency sweep
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(1200, now);
                    osc.frequency.exponentialRampToValueAtTime(350, now + 0.1);

                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(1800, now);

                    gainNode.gain.setValueAtTime(0.1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.005, now + 0.1);

                    osc.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.1);
                }
                else if (type === 'upgrade') {
                    // High-quality modern focus chime
                    const osc1 = audioCtx.createOscillator();
                    const osc2 = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();

                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(600, now);
                    osc1.frequency.exponentialRampToValueAtTime(1200, now + 0.25);

                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(300, now);
                    osc2.frequency.exponentialRampToValueAtTime(600, now + 0.25);

                    gainNode.gain.setValueAtTime(0.1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                    osc1.connect(gainNode);
                    osc2.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    osc1.start(now);
                    osc2.start(now);
                    osc1.stop(now + 0.3);
                    osc2.stop(now + 0.3);
                }
                else if (type === 'explosion') {
                    // High pass crisp white noise explosion
                    const bufferSize = audioCtx.sampleRate * 0.15;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(600, now);
                    filter.frequency.exponentialRampToValueAtTime(80, now + 0.15);

                    const gainNode = audioCtx.createGain();
                    gainNode.gain.setValueAtTime(0.15, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

                    noise.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    noise.start(now);
                    noise.stop(now + 0.15);
                }
                else if (type === 'hit') {
                    // Geometric heavy focus thud
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(40, now + 0.4);

                    gainNode.gain.setValueAtTime(0.3, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.005, now + 0.4);

                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    osc.start(now);
                    osc.stop(now + 0.4);
                }
            } catch (e) {
                console.warn("Audio Context blocked/unsupported: ", e);
            }
        }

        // --- GAME ENGINE SETUP ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('gameContainer');

        const scoreHUD = document.getElementById('scoreHUD');
        const highScoreHUD = document.getElementById('highScoreHUD');
        const heart1 = document.getElementById('heart1');
        const heart2 = document.getElementById('heart2');
        const heart3 = document.getElementById('heart3');

        // Upgrades Dock elements
        const badgeS = document.getElementById('badgeS');
        const badgeM = document.getElementById('badgeM');
        const badgeR = document.getElementById('badgeR');
        const badgeT = document.getElementById('badgeT');
        const badgeD = document.getElementById('badgeD');
        const levelS = document.getElementById('levelS');
        const levelM = document.getElementById('levelM');
        const levelR = document.getElementById('levelR');
        const levelT = document.getElementById('levelT');
        const levelD = document.getElementById('levelD');

        const menuOverlay = document.getElementById('menuOverlay');
        const menuTitle = document.getElementById('menuTitle');
        const menuTagline = document.getElementById('menuTagline');
        const menuStats = document.getElementById('menuStats');
        const actionButton = document.getElementById('actionButton');
        const lastScoreVal = document.getElementById('lastScoreVal');
        const highScoreVal = document.getElementById('highScoreVal');
        const newHighScoreLabel = document.getElementById('newHighScoreLabel');

        // State Machine
        const STATES = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
        let gameState = STATES.MENU;

        // Configuration and Constants
        const PLANET_RADIUS = 40;
        const INITIAL_CANNON_ROT_SPEED = 180; // Constant rotation speed (degrees per second)

        const COOLDOWN_DURATION = 250; // ms
        const PROJECTILE_SPEED = 1200; // px per second
        const PROJECTILE_RADIUS = 4;

        const MIN_ASTEROID_SPEED = 60; // px/sec
        const MAX_ASTEROID_SPEED = 180; // px/sec
        const ASTEROID_SPEED_GROWTH_DURATION = 120; // reach max in 120 seconds

        const SPAWN_INTERVAL_START = 2500; // ms
        const SPAWN_INTERVAL_MIN = 600; // ms
        const DIFFICULTY_STEP_DURATION = 30000; // reduce interval by 150ms every 30s
        const SPAWN_DECREMENT = 150; // ms

        // Global Game Variables
        let highScore = parseInt(localStorage.getItem('planet_defender_high_score')) || 0;
        let score = 0;
        let planetHealth = 3;
        let lastTime = 0;
        let gameTime = 0; // Cumulative active play seconds

        // Upgrades Stack
        let upgradeS = 0; // Split Count
        let upgradeM = 0; // Wave Multipliers
        let upgradeR = 0; // Rapid Reload Stack
        let upgradeT = 0; // Target Sight Level
        let upgradeD = 0; // Multiple Cannons Deployed Count

        // Cannon State
        let cannonAngle = 0; // Radians
        let cannonRotSpeed = INITIAL_CANNON_ROT_SPEED;
        let lastFireTime = 0;

        // Pending sequential waves (M powerup queue)
        let pendingShots = [];

        // Game Entities
        let projectiles = [];
        let asteroids = [];
        let stars = [];
        let explosions = [];
        let floatingTexts = [];
        let planetHits = []; // Crack locations to draw on the planet
        let screenShake = 0;

        // Spawning Timers
        let nextSpawnTime = 0;
        let currentSpawnInterval = SPAWN_INTERVAL_START;

        // Viewport Setup (Unified High-Res Canvas Mapping with responsive aspect locks)
        const VIEW_WIDTH = 1000;
        const VIEW_HEIGHT = 600;
        let scale = 1;

        function resizeCanvas() {
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;

            const targetRatio = VIEW_WIDTH / VIEW_HEIGHT;
            let width, height;

            if (containerWidth / containerHeight < targetRatio) {
                width = containerWidth;
                height = containerWidth / targetRatio;
            } else {
                height = containerHeight;
                width = containerHeight * targetRatio;
            }

            canvas.width = width;
            canvas.height = height;
            scale = width / VIEW_WIDTH;
        }

        // Initialize Background Stars Once
        function createStars() {
            stars = [];
            for (let i = 0; i < 75; i++) {
                stars.push({
                    x: Math.random() * VIEW_WIDTH,
                    y: Math.random() * VIEW_HEIGHT,
                    size: Math.random() * 1.5 + 0.5,
                    opacity: Math.random() * 0.4 + 0.2,
                    color: Math.random() > 0.8 ? '#a855f7' : (Math.random() > 0.5 ? '#38bdf8' : '#ffffff')
                });
            }
        }

        // Upgrade Badge Interface Updates
        function syncUpgradesUI() {
            if (upgradeS > 0) {
                badgeS.classList.add('active');
                levelS.innerText = `${upgradeS}`;
            } else {
                badgeS.classList.remove('active');
                levelS.innerText = `0`;
            }

            if (upgradeM > 0) {
                badgeM.classList.add('active');
                levelM.innerText = `${upgradeM}`;
            } else {
                badgeM.classList.remove('active');
                levelM.innerText = `0`;
            }

            if (upgradeR > 0) {
                badgeR.classList.add('active');
                levelR.innerText = `${upgradeR}`;
            } else {
                badgeR.classList.remove('active');
                levelR.innerText = `0`;
            }

            if (upgradeT > 0) {
                badgeT.classList.add('active');
                levelT.innerText = `${upgradeT}`;
            } else {
                badgeT.classList.remove('active');
                levelT.innerText = `0`;
            }

            if (upgradeD > 0) {
                badgeD.classList.add('active');
                levelD.innerText = `${upgradeD}`;
            } else {
                badgeD.classList.remove('active');
                levelD.innerText = `0`;
            }
        }

        // Float notification helper
        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.opacity = 1;
                this.vy = -40; // pixels per second up
                this.life = 1.0; // 1 second life
            }
            update(dt) {
                this.y += this.vy * dt;
                this.life -= dt;
                this.opacity = Math.max(this.life, 0);
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.font = "bold 14px system-ui, sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        // --- ENTITY MANIPULATION & SPAWNS ---
        class Asteroid {
            constructor() {
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.max(VIEW_WIDTH, VIEW_HEIGHT) / 2 + 50;

                this.x = VIEW_WIDTH / 2 + Math.cos(angle) * distance;
                this.y = VIEW_HEIGHT / 2 + Math.sin(angle) * distance;

                const targetX = VIEW_WIDTH / 2;
                const targetY = VIEW_HEIGHT / 2;
                const dx = targetX - this.x;
                const dy = targetY - this.y;
                const mag = Math.sqrt(dx * dx + dy * dy);

                this.vx = (dx / mag);
                this.vy = (dy / mag);

                const elapsedSeconds = gameTime;

                // Restored Speed Calculations
                const speedProgress = Math.min(elapsedSeconds / ASTEROID_SPEED_GROWTH_DURATION, 1);
                this.speed = MIN_ASTEROID_SPEED + speedProgress * (MAX_ASTEROID_SPEED - MIN_ASTEROID_SPEED);

                this.isGolden = false;
                this.upgradeType = null;

                // 22% Chance of Golden Asteroids after initial warm up
                if (elapsedSeconds > 3 && Math.random() < 0.22) {
                    this.isGolden = true;
                    const types = ['S', 'M', 'R', 'L', 'T', 'D'];
                    this.upgradeType = types[Math.floor(Math.random() * types.length)];
                    this.radius = 20;
                    this.hp = 1; // Exactly 1 hit point
                    this.maxHp = 1;
                    this.scoreValue = 10;
                    this.color = '#fbbf24'; // Glowing Amber-Gold Octagon
                } else {
                    // Standard sizes distribution
                    let r = Math.random();
                    let isLargeProb = Math.min(elapsedSeconds * 0.0025, 0.25);
                    let isMediumProb = Math.min(elapsedSeconds * 0.005, 0.45);

                    if (r < isLargeProb) {
                        this.setupType('large');
                    } else if (r < isLargeProb + isMediumProb) {
                        this.setupType('medium');
                    } else {
                        this.setupType('small');
                    }
                }

                this.spinAngle = Math.random() * Math.PI * 2;
                this.spinSpeed = (Math.random() - 0.5) * 1.5;
            }

            setupType(type) {
                this.type = type;
                if (type === 'large') {
                    this.radius = 26;
                    this.hp = 1; // Exactly 1 hit point
                    this.maxHp = 1;
                    this.scoreValue = 6;
                    this.color = '#f43f5e'; // Rose Hexagon
                } else if (type === 'medium') {
                    this.radius = 18;
                    this.hp = 1; // Exactly 1 hit point
                    this.maxHp = 1;
                    this.scoreValue = 3;
                    this.color = '#a855f7'; // Neon Purple Square
                } else {
                    this.radius = 12;
                    this.hp = 1; // Exactly 1 hit point
                    this.maxHp = 1;
                    this.scoreValue = 1;
                    this.color = '#06b6d4'; // Cyan Triangle
                }
            }

            update(dt) {
                this.x += this.vx * this.speed * dt;
                this.y += this.vy * this.speed * dt;
                this.spinAngle += this.spinSpeed * dt;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.spinAngle);

                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.fillStyle = 'rgba(9, 9, 11, 0.9)';
                ctx.beginPath();

                if (this.isGolden) {
                    // Draw perfect flat Octagon
                    for (let i = 0; i < 8; i++) {
                        const ang = (i / 8) * Math.PI * 2;
                        const px = Math.cos(ang) * this.radius;
                        const py = Math.sin(ang) * this.radius;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                } else if (this.type === 'large') {
                    // Draw perfect Hexagon
                    for (let i = 0; i < 6; i++) {
                        const ang = (i / 6) * Math.PI * 2;
                        const px = Math.cos(ang) * this.radius;
                        const py = Math.sin(ang) * this.radius;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                } else if (this.type === 'medium') {
                    // Draw Square
                    ctx.rect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
                } else {
                    // Draw Triangle
                    for (let i = 0; i < 3; i++) {
                        const ang = (i / 3) * Math.PI * 2 - Math.PI / 2;
                        const px = Math.cos(ang) * this.radius;
                        const py = Math.sin(ang) * this.radius;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Draw modern upgrade letter in golden geometries
                if (this.isGolden && this.upgradeType) {
                    ctx.rotate(-this.spinAngle); // Lock letter rotation straight up
                    ctx.fillStyle = '#fbbf24';
                    ctx.font = "800 13px system-ui, sans-serif";
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.upgradeType, 0, 0);
                }

                ctx.restore();
            }
        }

        class Projectile {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                this.startX = x;
                this.startY = y;
                this.radius = PROJECTILE_RADIUS;
                this.vx = Math.cos(angle) * PROJECTILE_SPEED;
                this.vy = Math.sin(angle) * PROJECTILE_SPEED;
                this.active = true;
            }

            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;

                // Bullet size grows as it travels farther (helps aiming)
                const dx = this.x - this.startX;
                const dy = this.y - this.startY;
                const distTraveled = Math.sqrt(dx * dx + dy * dy);

                // Radius increases up to a maximum to keep it within reasonable arcade bounds
                this.radius = Math.min(PROJECTILE_RADIUS + (distTraveled * 0.025), 18);

                if (this.x < -100 || this.x > VIEW_WIDTH + 100 || this.y < -100 || this.y > VIEW_HEIGHT + 100) {
                    this.active = false;
                }
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 4 + this.radius;
                ctx.fill();
                ctx.restore();
            }
        }

        class Explosion {
            constructor(x, y, size, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.progress = 0;
                this.maxSize = size * 1.8;
                this.duration = 0.4; // seconds

                this.debris = [];
                const particleCount = size > 18 ? 10 : 5;
                for (let i = 0; i < particleCount; i++) {
                    const ang = Math.random() * Math.PI * 2;
                    const spd = Math.random() * 120 + 40;
                    this.debris.push({
                        x: 0,
                        y: 0,
                        vx: Math.cos(ang) * spd,
                        vy: Math.sin(ang) * spd,
                        size: Math.random() * 2 + 1
                    });
                }
            }

            update(dt) {
                this.progress += dt / this.duration;
                this.debris.forEach(d => {
                    d.x += d.vx * dt;
                    d.y += d.vy * dt;
                });
            }

            draw() {
                const alpha = 1 - this.progress;
                if (alpha <= 0) return;

                ctx.save();
                ctx.translate(this.x, this.y);

                ctx.beginPath();
                ctx.arc(0, 0, this.maxSize * this.progress, 0, Math.PI * 2);
                ctx.strokeStyle = this.color;
                ctx.globalAlpha = alpha * 0.4;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                this.debris.forEach(d => {
                    ctx.beginPath();
                    ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.restore();
            }
        }

        // --- CORE GAME ACTIONS ---
        function fireProjectile() {
            if (gameState !== STATES.PLAYING) return;
            const now = Date.now();

            // Divide base cooldown dynamically based on Upgrade R stacks (twice as fast per tier)
            const currentCooldown = COOLDOWN_DURATION / Math.pow(2, upgradeR);
            if (now - lastFireTime < currentCooldown) return;

            initAudio();

            // Support both multiple guns and M Powerup support (waves)
            const totalGuns = 1 + upgradeD;
            const wavesTotal = 1 + upgradeM;

            for (let k = 0; k < totalGuns; k++) {
                const gunAngle = cannonAngle + (k * (Math.PI * 2) / totalGuns);
                for (let w = 0; w < wavesTotal; w++) {
                    pendingShots.push({
                        fireTime: now + (w * 75), // Spaced 75ms apart
                        angle: gunAngle
                    });
                }
            }

            lastFireTime = now;
            playSound('fire');
        }

        // Spawn actual bullets at selected angle (Split S support)
        function spawnBulletWave(angle) {
            // S upgrade triggers extra angled muzzles: Level 1 = 3 bullets, Level 2 = 5 bullets, etc.
            const spreadCount = 1 + upgradeS * 2;
            const barrelLength = 65;

            for (let i = 0; i < spreadCount; i++) {
                // Spacing offsets around base angle: exactly 1 degree separation (0.01745 radians) as instructed
                const offsetIndex = i - (spreadCount - 1) / 2;
                const bulletAngle = angle + (offsetIndex * 0.01745);

                const spawnX = VIEW_WIDTH / 2 + Math.cos(bulletAngle) * barrelLength;
                const spawnY = VIEW_HEIGHT / 2 + Math.sin(bulletAngle) * barrelLength;

                projectiles.push(new Projectile(spawnX, spawnY, bulletAngle));
            }
        }

        function triggerSpawn() {
            asteroids.push(new Asteroid());

            const indexReduction = Math.floor(gameTime / 30);
            currentSpawnInterval = Math.max(
                SPAWN_INTERVAL_START - (indexReduction * SPAWN_DECREMENT),
                SPAWN_INTERVAL_MIN
            );

            // Add +/- 10% randomness so spawn times cannot be memorized
            const randomVariance = (Math.random() * 0.2 - 0.1) * currentSpawnInterval;
            nextSpawnTime = Date.now() + currentSpawnInterval + randomVariance;
        }

        function damagePlanet(asteroidX, asteroidY) {
            planetHealth--;
            screenShake = 12;
            playSound('hit');

            const dx = asteroidX - VIEW_WIDTH / 2;
            const dy = asteroidY - VIEW_HEIGHT / 2;
            const angle = Math.atan2(dy, dx);

            planetHits.push({
                angle: angle,
                depth: Math.random() * 12 + 10,
                segments: 3 + Math.floor(Math.random() * 2)
            });

            updateHeartsUI();

            if (planetHealth <= 0) {
                gameOver();
            }
        }

        function triggerUpgrade(type, originX, originY) {
            playSound('upgrade');
            let upgradeLabel = "";
            let upgradeColor = "#ffffff";

            if (type === 'S') {
                upgradeS++;
                upgradeLabel = `SPLIT +1`;
                upgradeColor = "#ec4899";
            } else if (type === 'M') {
                upgradeM++;
                upgradeLabel = `WAVE +1`;
                upgradeColor = "#3b82f6";
            } else if (type === 'R') {
                upgradeR++;
                upgradeLabel = `FAST RECHARGE`;
                upgradeColor = "#10b981";
            } else if (type === 'L') {
                if (planetHealth < 3) {
                    planetHealth++;
                    upgradeLabel = "+1 HP";
                    upgradeColor = "#ef4444";
                } else {
                    upgradeLabel = "SHIELD STABLE";
                    upgradeColor = "#fbbf24";
                    score += 5;
                    scoreHUD.innerText = `Score: ${score}`;
                }
                updateHeartsUI();
            } else if (type === 'T') {
                upgradeT++;
                upgradeLabel = `SIGHT LOCKED`;
                upgradeColor = "#38bdf8";
            } else if (type === 'D') {
                upgradeD++;
                upgradeLabel = `CANNON DEPLOYED`;
                upgradeColor = "#f43f5e";
            }

            floatingTexts.push(new FloatingText(originX, originY - 15, upgradeLabel, upgradeColor));
            syncUpgradesUI();
        }

        function updateHeartsUI() {
            heart1.className = planetHealth < 1 ? "heart lost" : "heart";
            heart2.className = planetHealth < 2 ? "heart lost" : "heart";
            heart3.className = planetHealth < 3 ? "heart lost" : "heart";
        }

        // Initialize / Restart game
        function startGame() {
            initAudio();

            // Clear configurations
            projectiles = [];
            asteroids = [];
            explosions = [];
            planetHits = [];
            floatingTexts = [];
            pendingShots = [];
            score = 0;
            planetHealth = 3;
            gameTime = 0;
            cannonRotSpeed = INITIAL_CANNON_ROT_SPEED;
            cannonAngle = 0;
            screenShake = 0;
            lastFireTime = 0;

            // Clear upgrades
            upgradeS = 0;
            upgradeM = 0;
            upgradeR = 0;
            upgradeT = 0;
            upgradeD = 0;
            syncUpgradesUI();

            updateHeartsUI();
            scoreHUD.innerText = `Score: ${score}`;
            highScoreHUD.innerText = `High: ${highScore}`;

            // Initial game elements seeding
            asteroids.push(new Asteroid());
            currentSpawnInterval = SPAWN_INTERVAL_START;
            nextSpawnTime = Date.now() + currentSpawnInterval;

            gameState = STATES.PLAYING;
            menuOverlay.classList.add('hidden');
        }

        function gameOver() {
            gameState = STATES.GAMEOVER;

            let newHigh = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('planet_defender_high_score', highScore);
                newHigh = true;
            }

            menuTitle.innerText = "PLANET COLLAPSE";
            menuTitle.style.color = "#f43f5e";
            menuTagline.innerText = "The planetary core collapsed under geometric impact waves.";

            lastScoreVal.innerText = score;
            highScoreVal.innerText = highScore;
            menuStats.classList.remove('hidden');

            if (newHigh) {
                newHighScoreLabel.classList.remove('hidden');
            } else {
                newHighScoreLabel.classList.add('hidden');
            }

            actionButton.innerText = "Reboot Core";
            menuOverlay.classList.remove('hidden');
        }

        // --- CONTROLS / EVENTS BINDING (MOBILE ENHANCED) ---
        function triggerInput(e) {
            if (e.repeat) return;

            if (gameState === STATES.MENU || gameState === STATES.GAMEOVER) {
                initAudio();
                startGame();
            } else if (gameState === STATES.PLAYING) {
                fireProjectile();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                triggerInput(e);
            }
        });

        // Instant Touch Firing for Mobile Viewports
        window.addEventListener('touchstart', (e) => {
            if (e.target === actionButton) return;
            e.preventDefault(); // Completely eliminates mobile tap delay
            triggerInput(e);
        }, { passive: false });

        window.addEventListener('mousedown', (e) => {
            if (e.target === actionButton) return;
            // Prevent execution duplication if touchstart triggered it already
            if (e.pointerType === 'touch') return;
            triggerInput(e);
        });

        actionButton.addEventListener('click', (e) => {
            e.stopPropagation();
            initAudio();
            startGame();
        });

        window.addEventListener('resize', resizeCanvas);


        // --- UPDATE LOOP ---
        function update(dt) {
            if (screenShake > 0) {
                screenShake -= dt * 30;
                if (screenShake < 0) screenShake = 0;
            }

            // Update floating notification labels
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.update(dt);
                if (ft.life <= 0) {
                    floatingTexts.splice(i, 1);
                }
            }

            if (gameState !== STATES.PLAYING) return;

            gameTime += dt;

            // Cannon automatic rotation updates
            cannonRotSpeed = INITIAL_CANNON_ROT_SPEED;

            cannonAngle += (cannonRotSpeed * Math.PI / 180) * dt;
            if (cannonAngle > Math.PI * 2) {
                cannonAngle -= Math.PI * 2;
            }

            // Process scheduled sequential waves (M powerup queue)
            const now = Date.now();
            for (let i = pendingShots.length - 1; i >= 0; i--) {
                const ps = pendingShots[i];
                if (now >= ps.fireTime) {
                    spawnBulletWave(ps.angle);
                    pendingShots.splice(i, 1);
                }
            }

            // Spawner
            if (Date.now() >= nextSpawnTime) {
                triggerSpawn();
            }

            // Process Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.update(dt);
                if (!p.active) {
                    projectiles.splice(i, 1);
                }
            }

            // Process Asteroids
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const ast = asteroids[i];
                ast.update(dt);

                const dx = ast.x - VIEW_WIDTH / 2;
                const dy = ast.y - VIEW_HEIGHT / 2;
                const dist = Math.sqrt(dx * dx + dy * dy);

                // Planet Boundary Collision Detection
                if (dist <= PLANET_RADIUS + ast.radius - 2) {
                    damagePlanet(ast.x, ast.y);
                    asteroids.splice(i, 1);
                    continue;
                }

                // Projectile Collision Checks
                for (let j = projectiles.length - 1; j >= 0; j--) {
                    const proj = projectiles[j];
                    const pDx = ast.x - proj.x;
                    const pDy = ast.y - proj.y;
                    const pDist = Math.sqrt(pDx * pDx + pDy * pDy);

                    if (pDist <= ast.radius + proj.radius) {
                        ast.hp--;
                        projectiles.splice(j, 1);

                        if (ast.hp <= 0) {
                            score += ast.scoreValue;
                            scoreHUD.innerText = `Score: ${score}`;

                            explosions.push(new Explosion(ast.x, ast.y, ast.radius, ast.color));

                            // Golden Asteroids grant upgrades
                            if (ast.isGolden && ast.upgradeType) {
                                triggerUpgrade(ast.upgradeType, ast.x, ast.y);
                            } else {
                                playSound('explosion');
                            }

                            asteroids.splice(i, 1);
                        } else {
                            explosions.push(new Explosion(proj.x, proj.y, 4, '#38bdf8'));
                            playSound('explosion');
                        }
                        break;
                    }
                }
            }

            // Update Explosions
            for (let i = explosions.length - 1; i >= 0; i--) {
                const exp = explosions[i];
                exp.update(dt);
                if (exp.progress >= 1) {
                    explosions.splice(i, 1);
                }
            }
        }


        // --- RENDERING PIPELINE ---
        function draw() {
            ctx.save();

            // Apply Screen Shake Offsets
            if (screenShake > 0) {
                const shakeX = (Math.random() - 0.5) * screenShake;
                const shakeY = (Math.random() - 0.5) * screenShake;
                ctx.translate(shakeX, shakeY);
            }

            // Minimalist Space Obsidian Background
            ctx.fillStyle = '#09090b';
            ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);

            const center = { x: VIEW_WIDTH / 2, y: VIEW_HEIGHT / 2 };

            // --- RADIAL BACKGROUND GRAPH ---
            ctx.save();
            ctx.strokeStyle = 'rgba(168, 85, 247, 0.05)'; // Elegant thin neon purple target lines
            ctx.lineWidth = 1;

            // Concentric orbits
            for (let radius = 60; radius < 650; radius += 60) {
                ctx.beginPath();
                ctx.arc(center.x, center.y, radius, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Radial line spokes (every 30 degrees)
            for (let ang = 0; ang < Math.PI * 2; ang += Math.PI / 6) {
                ctx.beginPath();
                ctx.moveTo(center.x + Math.cos(ang) * 45, center.y + Math.sin(ang) * 45);
                ctx.lineTo(center.x + Math.cos(ang) * 700, center.y + Math.sin(ang) * 700);
                ctx.stroke();
            }
            ctx.restore();

            // Delicate Stars
            stars.forEach(star => {
                ctx.fillStyle = star.color;
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // Draw Target Sight Line for all active gun modules if upgraded
            if (upgradeT > 0 && gameState === STATES.PLAYING) {
                const totalGuns = 1 + upgradeD;
                for (let k = 0; k < totalGuns; k++) {
                    const currentGunAngle = cannonAngle + (k * (Math.PI * 2) / totalGuns);
                    const barrelLength = 65;
                    const sightStartX = center.x + Math.cos(currentGunAngle) * barrelLength;
                    const sightStartY = center.y + Math.sin(currentGunAngle) * barrelLength;
                    const sightEndX = center.x + Math.cos(currentGunAngle) * 1200;
                    const sightEndY = center.y + Math.sin(currentGunAngle) * 1200;

                    ctx.save();
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)'; // glowing neon blue
                    ctx.lineWidth = 1.2 + (upgradeT - 1) * 0.4;
                    ctx.setLineDash([8, 8]);
                    ctx.beginPath();
                    ctx.moveTo(sightStartX, sightStartY);
                    ctx.lineTo(sightEndX, sightEndY);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // Active visual cooldown indicator ring
            const now = Date.now();
            const timeSinceLastFire = now - lastFireTime;
            const currentCooldown = COOLDOWN_DURATION / Math.pow(2, upgradeR);
            const cooldownPct = Math.min(timeSinceLastFire / currentCooldown, 1.0);

            if (cooldownPct < 1.0 && gameState === STATES.PLAYING) {
                ctx.beginPath();
                ctx.arc(center.x, center.y, PLANET_RADIUS + 12, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * cooldownPct));
                ctx.strokeStyle = '#a855f7'; // Purple energy ring
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            // Draw Entities
            projectiles.forEach(p => p.draw());
            asteroids.forEach(a => a.draw());
            explosions.forEach(e => e.draw());

            // --- MINIMAL PLANET CORE ---
            // Base geometric interior
            ctx.beginPath();
            ctx.arc(center.x, center.y, PLANET_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = '#18181b';
            ctx.fill();

            // Planet Damage Crack vectors
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            planetHits.forEach(crack => {
                ctx.save();
                ctx.translate(center.x, center.y);
                ctx.rotate(crack.angle);

                ctx.beginPath();
                ctx.moveTo(PLANET_RADIUS, 0);

                let currentRadius = PLANET_RADIUS;
                let currentY = 0;
                for (let s = 0; s < crack.segments; s++) {
                    currentRadius -= crack.depth / crack.segments;
                    currentY += (Math.random() - 0.5) * 6;
                    ctx.lineTo(currentRadius, currentY);
                }
                ctx.stroke();
                ctx.restore();
            });

            // Modern outer neon orbit ring
            ctx.beginPath();
            ctx.arc(center.x, center.y, PLANET_RADIUS, 0, Math.PI * 2);
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.stroke();

            // --- 3D-LOOK MINIMAL GUN CANNON ---
            const totalGuns = 1 + upgradeD;
            for (let k = 0; k < totalGuns; k++) {
                const currentGunAngle = cannonAngle + (k * (Math.PI * 2) / totalGuns);
                ctx.save();
                ctx.translate(center.x, center.y);
                ctx.rotate(currentGunAngle);

                // Minimalist gun block barrel
                ctx.fillStyle = '#27272a';
                ctx.strokeStyle = '#52525b';
                ctx.lineWidth = 1.5;

                // Barrel 1
                ctx.fillRect(10, -7, 45, 5);
                ctx.strokeRect(10, -7, 45, 5);
                // Barrel 2
                ctx.fillRect(10, 2, 45, 5);
                ctx.strokeRect(10, 2, 45, 5);

                // Power tips
                ctx.fillStyle = '#a855f7';
                ctx.fillRect(51, -7, 4, 5);
                ctx.fillRect(51, 2, 4, 5);

                ctx.restore();
            }

            // Central mounting hub plate (drawn once over barrel joints)
            ctx.save();
            ctx.translate(center.x, center.y);

            ctx.beginPath();
            ctx.arc(0, 0, 16, 0, Math.PI * 2);
            ctx.fillStyle = '#09090b';
            ctx.strokeStyle = '#27272a';
            ctx.lineWidth = 2.5;
            ctx.fill();
            ctx.stroke();

            // High frequency central power node
            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#a855f7';
            ctx.fill();

            ctx.restore(); // end gun base draw

            // Draw floating texts
            floatingTexts.forEach(ft => ft.draw());

            ctx.restore(); // end screen shake
        }


        // --- MAIN GAME LOOP ---
        function gameLoop(currentTime) {
            if (!lastTime) lastTime = currentTime;

            let dt = (currentTime - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1;

            lastTime = currentTime;

            update(dt);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.scale(scale, scale);
            draw();
            ctx.restore();

            requestAnimationFrame(gameLoop);
        }

        // --- ENGINE BOOTSTRAP ---
        window.onload = function () {
            resizeCanvas();
            createStars();

            if (highScore > 0) {
                highScoreHUD.innerText = `High: ${highScore}`;
                lastScoreVal.innerText = 0;
                highScoreVal.innerText = highScore;
                menuStats.classList.remove('hidden');
            }

            requestAnimationFrame(gameLoop);
        };
    </script>
</body>

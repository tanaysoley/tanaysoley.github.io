<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05060d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>POG 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <section id="hud" aria-label="Game status">
      <div class="hud-top">
        <div class="score-block">
          <div class="label">Survived</div>
          <div id="score" class="score">0.0<span>s</span></div>
          <div class="best">Best <span id="best">0.0s</span></div>
        </div>
        <div class="hud-buttons">
          <button id="pauseBtn" class="icon-btn" aria-label="Pause">❚❚</button>
          <button id="muteBtn" class="icon-btn" aria-label="Mute">♪</button>
        </div>
      </div>
      <div class="bars">
        <div class="bar-row">
          <span class="bar-label">Planet</span>
          <div class="bar"><div id="healthFill" class="fill"></div></div>
          <span id="healthText" class="bar-val">100</span>
        </div>
        <div class="bar-row" id="shieldRow">
          <span class="bar-label">Shield</span>
          <div class="bar"><div id="shieldFill" class="fill"></div></div>
          <span id="shieldText" class="bar-val">—</span>
        </div>
      </div>
      <div id="stats" class="stats"></div>
      <div class="powers">
        <div class="power-col">
          <div class="section-label">Active powers</div>
          <div id="activePowers" class="active-powers"></div>
        </div>
        <div class="power-col">
          <div class="section-label">Queued</div>
          <div id="queue" class="queue"></div>
        </div>
      </div>
    </section>
    <main id="stage">
      <canvas id="game" aria-label="POG 2 play area"></canvas>
    </main>
  </div>

  <div id="overlay">
    <div class="panel">
      <h1 id="ovTitle">POG 2</h1>
      <div id="ovBody"></div>
      <div id="ovAction" class="cta">Tap to start</div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Tree</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <style>
        :root {
            --bg: #f8fafc;
            --line: #64748b;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #64748b;
            --accent: #4f46e5;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            font-family: system-ui, -apple-system, "Segoe UI", "Nirmala UI", "Noto Sans", "Noto Sans Devanagari", Roboto, sans-serif;
            color: var(--text);
            background: #fff;
        }

        /* ---------- Toolbar ---------- */
        #toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-bottom: 1px solid var(--border);
            background: #fff;
            flex: none;
            flex-wrap: wrap;
        }

        #toolbar .title {
            font-weight: 700;
            font-size: 15px;
            margin-right: 8px;
        }

        #toolbar button {
            font: inherit;
            font-size: 13px;
            padding: 5px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
            color: var(--text);
            cursor: pointer;
        }

        #toolbar button:hover {
            background: #f1f5f9;
        }

        #toolbar input[type="text"] {
            font: inherit;
            font-size: 13px;
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            width: 230px;
        }

        #toolbar select {
            font: inherit;
            font-size: 13px;
            padding: 4px 6px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
            color: var(--text);
            cursor: pointer;
        }

        #toolbar .sep {
            width: 1px;
            height: 22px;
            background: var(--border);
            margin: 0 4px;
        }

        #toolbar .hint {
            margin-left: auto;
            font-size: 12px;
            color: var(--muted);
        }

        /* ---------- Layout ---------- */
        main {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        #editorPane {
            width: 38%;
            min-width: 240px;
            display: flex;
            flex-direction: column;
            flex: none;
            border-right: 1px solid var(--border);
        }

        #editorPane.hidden,
        #divider.hidden {
            display: none;
        }

        #editor {
            flex: 1;
            min-height: 0;
        }

        #editor .CodeMirror {
            height: 100%;
            font-size: 13px;
        }

        .cm-error-line {
            background: #fee2e2;
        }

        .cm-jump-line {
            background: #e0e7ff;
        }

        /* CSV columns get alternating colours so it's easier to see which value is in which column */
        .cm-csv-sep {
            color: #94a3b8;
        }

        .cm-csv-c0 {
            color: #0f172a;
        }

        .cm-csv-c1 {
            color: #1d4ed8;
        }

        .cm-csv-c2 {
            color: #b45309;
        }

        .cm-csv-c3 {
            color: #047857;
        }

        .cm-csv-c4 {
            color: #7c3aed;
        }

        .cm-csv-c5 {
            color: #be123c;
        }

        #colInfo {
            flex: none;
            font-size: 12px;
            color: var(--muted);
            padding: 3px 10px;
            border-top: 1px solid var(--border);
            min-height: 22px;
        }

        #status {
            flex: none;
            max-height: 30%;
            overflow: auto;
            font-size: 12px;
            padding: 6px 10px;
            border-top: 1px solid var(--border);
        }

        #status.ok {
            color: #15803d;
        }

        #status.warn {
            color: #b45309;
        }

        #status.error {
            color: #b91c1c;
            background: #fef2f2;
        }

        #status ul {
            margin: 4px 0 0;
            padding-left: 18px;
        }

        #divider {
            width: 5px;
            cursor: col-resize;
            flex: none;
            background: transparent;
        }

        #divider:hover {
            background: var(--border);
        }

        /* ---------- Tree view ---------- */
        #view {
            touch-action: none;
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg);
            cursor: grab;
            user-select: none;
        }

        #view.dragging {
            cursor: grabbing;
        }

        #world {
            position: absolute;
            left: 0;
            top: 0;
            transform-origin: 0 0;
            background: var(--bg);
        }

        .world>.layer {
            position: absolute;
            left: 0;
            top: 0;
        }

        #empty {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            pointer-events: none;
        }

        #empty[hidden] {
            display: none;
        }

        .axis {
            position: absolute;
            left: 0;
            right: 0;
            height: 28px;
            background: rgba(255, 255, 255, 0.94);
            overflow: hidden;
            font-size: 11px;
            color: var(--muted);
            pointer-events: none;
            z-index: 2;
        }

        .axis.top {
            top: 0;
            border-bottom: 1px solid var(--border);
        }

        .axis.bottom {
            bottom: 0;
            border-top: 1px solid var(--border);
        }

        .axis .tick {
            position: absolute;
            width: 1px;
            height: 4px;
            background: #94a3b8;
        }

        .axis .tick.major {
            height: 8px;
            background: #475569;
        }

        .axis.top .tick {
            bottom: 0;
        }

        .axis.bottom .tick {
            top: 0;
        }

        .axis .lbl {
            position: absolute;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        .axis.top .lbl {
            top: 4px;
        }

        .axis.bottom .lbl {
            bottom: 4px;
        }

        .axis .today {
            position: absolute;
            transform: translateX(-50%);
            color: #dc2626;
            font-weight: 600;
            white-space: nowrap;
        }

        .axis.top .today {
            top: 4px;
        }

        .axis.bottom .today {
            bottom: 4px;
        }

        /* Grid & lines */
        .grid-line {
            stroke: #e2e8f0;
            stroke-width: 1;
        }

        .today-line {
            stroke: #fca5a5;
            stroke-width: 1.5;
            stroke-dasharray: 6 5;
        }

        /* Ribbons */
        .ribbon {
            position: absolute;
            height: 12px;
            border-radius: 2px;
        }

        /* Cards */
        .card {
            position: absolute;
            width: 240px;
            border: 1.5px solid;
            border-radius: 10px;
            padding: 8px 10px;
            display: grid;
            grid-template-columns: 56px 1fr;
            column-gap: 10px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
            font-size: 12px;
            color: #1e293b;
        }

        .card.male {
            background: #eff6ff;
            border-color: #60a5fa;
        }

        .card.female {
            background: #fdf2f8;
            border-color: #f472b6;
        }

        .card.other {
            background: #f0fdf4;
            border-color: #4ade80;
        }

        .card.drop {
            outline: 3px dashed var(--accent);
            outline-offset: 2px;
        }

        .photo {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            overflow: hidden;
            background: #cbd5e1;
            position: relative;
            cursor: pointer;
        }

        .photo img,
        .photo svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo::after {
            content: "Change";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.55);
            color: #fff;
            font-size: 11px;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .photo:hover::after {
            opacity: 1;
        }

        .photo-remove {
            position: absolute;
            left: 4px;
            top: 4px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: none;
            background: #0f172a;
            color: #fff;
            font-size: 12px;
            line-height: 18px;
            padding: 0;
            cursor: pointer;
            display: none;
        }

        .card:hover .photo-remove {
            display: block;
        }

        .info {
            min-width: 0;
        }

        .name {
            line-height: 1.3;
            color: #334155;
            overflow-wrap: anywhere;
        }

        .name.primary {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .dates {
            margin-top: 4px;
            color: #475569;
            font-size: 11.5px;
        }

        .notes {
            grid-column: 1 / -1;
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid rgba(15, 23, 42, 0.1);
            font-size: 11.5px;
            line-height: 1.4;
            overflow-wrap: anywhere;
            user-select: text;
        }

        .notes p,
        .notes ul,
        .notes ol {
            margin: 0 0 4px;
        }

        .notes ul,
        .notes ol {
            padding-left: 16px;
        }

        .notes> :last-child {
            margin-bottom: 0;
        }

        .notes img {
            max-width: 100%;
        }

        /* Collapse controls */
        .toggle {
            position: absolute;
            width: 18px;
            height: 18px;
            margin: -9px 0 0 -9px;
            border-radius: 50%;
            border: 1.5px solid var(--line);
            background: #fff;
            color: var(--text);
            font: 600 13px/14px system-ui, sans-serif;
            padding: 0;
            cursor: pointer;
            z-index: 1;
        }

        .toggle:hover {
            background: #e0e7ff;
        }

        .collapsed-label {
            position: absolute;
            transform: translateY(-50%);
            margin-left: 14px;
            padding: 1px 8px;
            border-radius: 10px;
            background: #e2e8f0;
            color: #334155;
            font-size: 11px;
            white-space: nowrap;
        }

        /* Compact view: smaller cards and tighter rows, for printing and small screens */
        .compact .card {
            width: 168px;
            padding: 4px 6px;
            grid-template-columns: 30px 1fr;
            column-gap: 6px;
            align-items: center;
            border-width: 1px;
            border-radius: 7px;
        }

        .compact .photo {
            width: 30px;
            height: 30px;
        }

        .compact .photo::after {
            content: "✎";
            font-size: 12px;
        }

        .compact .name.primary {
            font-size: 12px;
            line-height: 1.2;
        }

        .compact .dates {
            margin-top: 1px;
            font-size: 10.5px;
        }

        .compact .ribbon {
            height: 6px;
            border-radius: 1px;
        }

        .compact .toggle {
            width: 14px;
            height: 14px;
            margin: -7px 0 0 -7px;
            border-width: 1px;
            font-size: 11px;
            line-height: 11px;
        }

        .compact .collapsed-label {
            margin-left: 10px;
            padding: 0 6px;
            font-size: 10px;
        }

        /* Print view: text-only cards in one column per generation */
        #world.print {
            background: #fff;
        }

        .print-mode .axis {
            display: none;
        }

        .print .card,
        .print .card.male,
        .print .card.female,
        .print .card.other {
            display: block;
            width: 210px;
            padding: 5px 8px;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-left-width: 4px;
            border-radius: 4px;
            box-shadow: none;
        }

        .print .card.male {
            border-left-color: #3b82f6;
        }

        .print .card.female {
            border-left-color: #ec4899;
        }

        .print .card.other {
            border-left-color: #22c55e;
        }

        .print .name.primary {
            font-size: 12.5px;
        }

        .print .alt-names {
            font-size: 11px;
            color: #475569;
            overflow-wrap: anywhere;
        }

        .print .dates {
            margin-top: 2px;
            font-size: 11px;
        }

        .print .notes {
            margin-top: 4px;
            padding-top: 4px;
            font-size: 11px;
        }

        /* Footer note at the bottom of exports and printouts */
        .page-footer {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 10px 40px 14px;
            border-top: 1px solid #e2e8f0;
            background: #fff;
            font-size: 12px;
            color: #475569;
        }

        #printFooter {
            display: none;
        }

        .gen-band {
            position: absolute;
            top: 0;
            background: #f1f5f9;
        }

        .gen-head {
            position: absolute;
            top: 14px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            white-space: nowrap;
        }

        @media print {
            html,
            body {
                height: auto;
                display: block;
                background: #fff;
            }

            #toolbar,
            #editorPane,
            #divider,
            .axis,
            #empty,
            .no-export {
                display: none !important;
            }

            main {
                display: block;
            }

            #printFooter:not(:empty) {
                display: flex;
                padding: 8px 0 0;
                break-inside: avoid;
            }

            #view {
                position: static;
                overflow: visible;
                background: #fff;
            }

            #world {
                position: relative;
                transform: none !important;
                zoom: var(--print-zoom, 1);
            }
        }

        @media (max-width: 1100px) {
            #toolbar .hint {
                display: none;
            }
        }

        @media (max-width: 700px) {
            #toolbar {
                gap: 4px;
                padding: 4px 6px;
            }

            #toolbar .title,
            #toolbar .sep {
                display: none;
            }

            #toolbar button {
                font-size: 12px;
                padding: 4px 7px;
            }
        }

        /* Off-screen copy of the tree used for PNG/PDF export */
        .export-stage {
            position: fixed;
            left: -200000px;
            top: 0;
            background: var(--bg);
        }

        .export-stage .axis {
            position: relative;
        }
    </style>
</head>

<body>
    <header id="toolbar">
        <span class="title">Family Tree</span>
        <button id="btnToggleEditor">Hide editor</button>
        <span class="sep"></span>
        <button id="btnOpen" title="Open a .csv file, or a .zip saved with photos">Open…</button>
        <button id="btnSave" title="Download the tree as a .csv file">Save CSV</button>
        <button id="btnSaveZip" title="Download the .csv together with all photos as a .zip">Save with photos</button>
        <button id="btnReset">Reset to sample</button>
        <span class="sep"></span>
        <button id="btnZoomOut" title="Zoom out">−</button>
        <button id="btnZoomIn" title="Zoom in">+</button>
        <button id="btnFit">Fit</button>
        <select id="viewMode" title="Choose how the tree is shown">
            <option value="detailed">Detailed view</option>
            <option value="compact">Compact view</option>
            <option value="print">Print view</option>
        </select>
        <span class="sep"></span>
        <button id="btnPng">Export PNG</button>
        <button id="btnPdf">Export PDF</button>
        <button id="btnPrint" title="Print the tree, scaled to the page width">Print…</button>
        <input type="text" id="footerNote" placeholder="Footer note, e.g. Maintained by …"
            title="Printed at the bottom of PNG/PDF exports and printouts. Leave empty for none.">
        <span class="hint">Drag to pan · Scroll to move · Ctrl + scroll to zoom · Click a photo to set it · Double-click a card to edit</span>
        <input type="file" id="fileOpen" accept=".csv,.tsv,.txt,.zip,.yaml,.yml" hidden>
        <input type="file" id="filePhoto" accept="image/*" hidden>
    </header>
    <main>
        <section id="editorPane">
            <div id="editor"></div>
            <div id="colInfo"></div>
            <div id="status"></div>
        </section>
        <div id="divider"></div>
        <section id="view">
            <div id="world" class="world">
                <svg id="grid" class="layer"></svg>
                <div id="ribbons" class="layer"></div>
                <svg id="lines" class="layer"></svg>
                <div id="cards" class="layer"></div>
                <div id="controls" class="layer"></div>
            </div>
            <div id="empty" hidden>Add people to the config to see the tree.</div>
            <div id="axisTop" class="axis top"></div>
            <div id="axisBottom" class="axis bottom"></div>
        </section>
    </main>
    <div id="printFooter" class="page-footer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>

        //   buf:     gap between the birth point and the card, so the ribbon start is visible
        //   rowGap:  vertical gap between rows

        const SILHOUETTE_URI = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(SILHOUETTE);

        // ---------- Dates ----------
        function parseDate(v) {
            if (v === null || v === undefined || String(v).trim() === '') return null;
            let s = String(v).trim();
            let approx = false;
            if (s.startsWith('~')) { approx = true; s = s.slice(1).trim(); }
            const m = /^(\d{1,4})(?:-(\d{1,2})(?:-(\d{1,2}))?)?$/.exec(s);
            if (!m) throw new Error(`invalid date "${v}" (use YYYY, YYYY-MM or YYYY-MM-DD, with ~ in front if approximate)`);
            const y = +m[1], mo = m[2] ? +m[2] : null, d = m[3] ? +m[3] : null;
            if (mo !== null && (mo < 1 || mo > 12)) throw new Error(`invalid month in "${v}"`);
            if (d !== null && (d < 1 || d > 31)) throw new Error(`invalid day in "${v}"`);
            let t, text;
            if (mo === null) { t = y + 0.5; text = `${y}`; }
            else if (d === null) { t = y + (mo - 0.5) / 12; text = `${MONTHS[mo - 1]} ${y}`; }
            else { t = y + (mo - 1 + (d - 0.5) / 31) / 12; text = `${d} ${MONTHS[mo - 1]} ${y}`; }

        function parseCSV(text) {
            const firstLine = text.split(/\r?\n/).find(l => l.trim() && !l.trimStart().startsWith('#')) || '';
            const delim = [',', '\t', ';']
                .map(d => [d, firstLine.split(d).length])
                .sort((a, b) => b[1] - a[1])[0][0];

            const n = text.length;
            let i = 0, line = 1;

                const phys = text.slice(i, eol);
                if (!phys.trim() || phys.trimStart().startsWith('#')) { i = eol + 1; line++; continue; }

                const startLine = line;
                const fields = [];
                let field = '', inQ = false;
                while (i < n) {
                    const c = text[i];

                            inQ = false; i++; continue;

                    if (c === delim) { fields.push(field); field = ''; i++; continue; }
                    if (c === '\n') { i++; line++; break; }
                    if (c !== '\r') field += c;
                    i++;

                if (inQ) {

                fields.push(field);

                    primary.className = 'name primary';
                    primary.textContent = p.names[0];
                    info.appendChild(primary);
                    if (p.names.length > 1) {
                        const alt = document.createElement('div');
                        alt.className = 'alt-names';
                        alt.textContent = p.names.slice(1).join(' · ');
                        info.appendChild(alt);
                    }
                    const dates = document.createElement('div');
                    dates.className = 'dates';
                    dates.textContent = `b. ${p.birth.text}` + (p.death ? ` · d. ${p.death.text}` : '');
                    info.appendChild(dates);
                    el.appendChild(info);
                    if (p.notes.trim()) el.appendChild(notesEl(p));
                    layer.appendChild(el);
                    els.push(el);
                    continue;
                }

                const photo = document.createElement('div');
                photo.className = 'photo';
                photo.title = 'Click or drop an image to set the photo';
                const src = photoFor(p);
                if (src) {
                    const img = document.createElement('img');
                    img.alt = '';
                    img.onerror = () => { photo.innerHTML = SILHOUETTE; };
                    img.src = src;
                    photo.appendChild(img);
                } else {
                    photo.innerHTML = SILHOUETTE;
                }
                el.appendChild(photo);

                const compact = viewMode === 'compact';
                if (compact) {
                    // Everything that doesn't fit on the small card is shown on hover.
                    el.title = [...p.names, `b. ${p.birth.text}` + (p.death ? ` · d. ${p.death.text}` : ''), p.notes.trim()]
                        .filter(Boolean).join('\n');
                }
                if (photos.has(p.key) && !compact) {
                    const rm = document.createElement('button');
                    rm.className = 'photo-remove no-export';
                    rm.title = 'Remove photo';
                    rm.textContent = '×';
                    rm.dataset.remove = p.key;
                    el.appendChild(rm);
                }

                const info = document.createElement('div');
                info.className = 'info';
                (compact ? p.names.slice(0, 1) : p.names).forEach((n, i) => {
                    const d = document.createElement('div');
                    d.className = i === 0 ? 'name primary' : 'name';
                    d.textContent = n;
                    info.appendChild(d);
                });
                const dates = document.createElement('div');
                dates.className = 'dates';
                dates.textContent = compact
                    ? (p.death ? `${p.birth.short} – ${p.death.short}` : `b. ${p.birth.short}`)
                    : `b. ${p.birth.text}` + (p.death ? ` · d. ${p.death.text}` : '');
                info.appendChild(dates);
                el.appendChild(info);

                if (p.notes.trim() && !compact) el.appendChild(notesEl(p));
                layer.appendChild(el);
                els.push(el);
            }
            for (const el of els) heights.set(el.dataset.key, el.offsetHeight);
        }

        let remeasureTimer = 0;
        function remeasure() {
            clearTimeout(remeasureTimer);
            remeasureTimer = setTimeout(() => {
                if (!model) return;
                for (const el of $('cards').children) {
                    if (el.style.display !== 'none') heights.set(el.dataset.key, el.offsetHeight);
                }
                relayoutRows();
                render();
            }, 50);
        }

        function relayoutRows() {
            // The print view always shows everyone, in one column per generation.
            const r = buildRows(model, isPrint() ? new Set() : collapsed);
            if (isPrint()) {
                r.gens = computeGenerations(model, r.rows);
                r.genCount = Math.max(0, ...r.gens.values()) + 1;
            }
            const top = new Map();
            let y = PAD_T;
            for (const p of r.rows) {
                top.set(p.key, y);
                y += heights.get(p.key) + ROW_GAP;
            }
            layout = { ...r, top, worldH: Math.max(y - ROW_GAP + PAD_B, PAD_T + PAD_B) };
            for (const el of $('cards').children) el.style.display = r.visible.has(el.dataset.key) ? '' : 'none';
        }

        function computeMinPpy() {
            // Zooming out further than this would push children's birth points behind their parents' cards.
            let need = 4;
            for (const f of model.families) {
                if (!f.children.length) continue;
                const pc = Math.max(...f.parents.map(p => columns.get(p.key)));
                const gap = Math.min(...f.children.map(c => c.birth.t)) - pc;
                if (gap > 2) need = Math.max(need, (BUF + CARD_W + TRUNK_MARGIN) / gap);
            }
            return Math.min(need, 40);
        }

        // ---------- Connectors ----------
        function computeLines() {
            const vis = layout.visible;
            const segsV = [];      // vertical segments (for hop detection)
            const segsH = [];      // horizontal connectors
            const singles = [];    // vertical single lines to draw
            const doubles = [];
            const controls = [];
            const trunks = [];

            const infos = [];
            for (const f of model.families) {
                if (!f.parents.every(p => vis.has(p.key))) continue;
                let sx, sy;
                if (f.parents.length === 2) {
                    let [a, b] = f.parents.map(p => rects.get(p.key));
                    if (a.y > b.y) [a, b] = [b, a];
                    if (Math.abs(a.cx - b.cx) < 1) {
                        doubles.push([[a.cx, a.b], [a.cx, b.y]]);
                        segsV.push({ x: a.cx, y1: a.b, y2: b.y, fam: f.key });
                        sx = a.cx;
                        sy = b.y - ROW_GAP / 2;
                    } else {
                        const ym = b.y - ROW_GAP / 2;
                        doubles.push([[a.cx, a.b], [a.cx, ym], [b.cx, ym], [b.cx, b.y]]);
                        segsV.push({ x: a.cx, y1: a.b, y2: ym, fam: f.key });
                        segsV.push({ x: b.cx, y1: ym, y2: b.y, fam: f.key });
                        sx = b.cx;
                        sy = ym;
                    }
                } else {
                    const a = rects.get(f.parents[0].key);
                    sx = a.cx;
                    sy = a.b + ROW_GAP / 2;
                    if (f.children.length) {
                        singles.push({ x: sx, y1: a.b, y2: sy });
                        segsV.push({ x: sx, y1: a.b, y2: sy, fam: f.key });
                    }
                }
                const parentRight = Math.max(...f.parents.map(p => rects.get(p.key).r));
                infos.push({ f, sx, sy, parentRight });
            }
            infos.sort((a, b) => a.sy - b.sy);

            const visibleRects = [...rects.entries()];
            for (const { f, sx, sy, parentRight } of infos) {
                if (!f.children.length) continue;
                const isCollapsed = !isPrint() && collapsed.has(f.key);
                if (!isPrint()) controls.push({ x: sx, y: sy, f, collapsed: isCollapsed });
                const kids = f.children.filter(c => vis.has(c.key));
                if (isCollapsed || !kids.length) continue;

                const kidKeys = new Set(kids.map(k => k.key));
                const ys = kids.map(c => rects.get(c.key).cy);
                const y1 = Math.min(sy, ...ys), y2 = Math.max(sy, ...ys);
                const obstacles = visibleRects.filter(([k, r]) => !kidKeys.has(k) && r.b > y1 && r.y < y2).map(([, r]) => r);

                // Slide the vertical trunk right until it clears cards and other trunks.
                let x = parentRight + 16;
                for (let iter = 0; iter < 500; iter++) {
                    let moved = false;
                    for (const o of obstacles) if (x > o.x - 8 && x < o.r + 8) { x = o.r + 16; moved = true; }
                    for (const t of trunks) if (t.y1 < y2 && t.y2 > y1 && Math.abs(t.x - x) < 8) { x = t.x + 10; moved = true; }
                    if (!moved) break;
                }
                const trunk = { x, y1, y2, fam: f.key };
                trunks.push(trunk);
                singles.push(trunk);
                segsV.push(trunk);
                if (Math.abs(x - sx) > 0.5) segsH.push({ x1: sx, x2: x, y: sy, fam: f.key });
                for (const c of kids) {
                    // Timeline views end the line at the birth date (start of the ribbon); print view at the card.
                    const end = isPrint() ? rects.get(c.key).x : X(c.birth.t);
                    segsH.push({ x1: x, x2: end, y: rects.get(c.key).cy, fam: f.key, dashed: f.adopted.has(c.key) });
                }
            }
            return { segsV, segsH, singles, doubles, controls };
        }

        // Horizontal path with small semicircle "hops" where it crosses another family's vertical line.
        function hopPath(h, segsV) {
            const lo = Math.min(h.x1, h.x2), hi = Math.max(h.x1, h.x2);
            const R = 5;
            const xs = segsV
                .filter(v => v.fam !== h.fam && v.x > lo + R + 1 && v.x < hi - R - 1 && h.y > v.y1 + 1 && h.y < v.y2 - 1)
                .map(v => v.x)
                .sort((a, b) => a - b)
                .filter((x, i, arr) => i === 0 || x - arr[i - 1] > 2 * R + 2);
            let d = `M${lo} ${h.y}`;
            for (const x of xs) d += ` L${x - R} ${h.y} A${R} ${R} 0 0 1 ${x + R} ${h.y}`;
            return d + ` L${hi} ${h.y}`;
        }

        // ---------- Axis ----------
        function tickStep() {
            for (const s of [1, 2, 5, 10, 20, 25, 50, 100]) if (s * ppy >= 56) return s;
            return 100;
        }

        function axisHTML(offset, width) {
            const step = tickStep();
            const minor = step <= 2 ? 1 : step / 5;
            const t0 = Math.max(startT, (-offset - PAD_L) / ppy + startT);
            const t1 = Math.min(endT, (width - offset - PAD_L) / ppy + startT);
            let html = '';
            for (let y = Math.ceil(t0 / minor) * minor; y <= t1; y += minor) {
                const x = X(y) + offset;
                const major = y % step === 0;
                html += `<div class="tick${major ? ' major' : ''}" style="left:${x}px"></div>`;
                if (major && X(endT) - X(y) > 40) html += `<div class="lbl" style="left:${x}px">${y}</div>`;
            }
            html += `<div class="today" style="left:${X(endT) + offset}px">Today</div>`;
            return html;
        }

        function renderAxes() {
            if (!model || isPrint()) { $('axisTop').innerHTML = $('axisBottom').innerHTML = ''; return; }
            const w = view.clientWidth;
            $('axisTop').innerHTML = $('axisBottom').innerHTML = axisHTML(tx, w);
        }

        // ---------- Render ----------
        function render() {
            if (!model || !layout) return;
            rects = new Map();
            let maxRight = 0;
            const print = isPrint();
            const colX = g => PAD_L + g * (CARD_W + COL_GAP);
            for (const p of layout.rows) {
                const el = $('cards').querySelector(`[data-key="${CSS.escape(p.key)}"]`);
                const x = print ? colX(layout.gens.get(p.key)) : X(columns.get(p.key)) + BUF;
                const y = layout.top.get(p.key);
                const h = heights.get(p.key);
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                rects.set(p.key, { x, y, r: x + CARD_W, b: y + h, cx: x + CARD_W / 2, cy: y + h / 2 });
                maxRight = Math.max(maxRight, x + CARD_W);
            }
            worldW = print ? maxRight + PAD_L : Math.max(X(endT) + 80, maxRight + 60);
            const worldH = layout.worldH;
            world.style.width = worldW + 'px';
            world.style.height = worldH + 'px';

            // Grid
            const grid = $('grid');
            grid.setAttribute('width', worldW);
            grid.setAttribute('height', worldH);
            const step = tickStep();
            let g = '';
            if (!print) {
                for (let y = Math.ceil(startT / step) * step; y <= endT; y += step) {
                    g += `<line class="grid-line" x1="${X(y)}" x2="${X(y)}" y1="0" y2="${worldH}"/>`;
                }
                g += `<line class="today-line" x1="${X(endT)}" x2="${X(endT)}" y1="0" y2="${worldH}"/>`;
            }
            grid.innerHTML = g;

            // Ribbons (timeline views) or generation columns (print view)
            const now = endT;
            let rb = '';
            if (print) {
                for (let gi = 0; gi < layout.genCount; gi++) {
                    if (gi % 2 === 0) rb += `<div class="gen-band" style="left:${colX(gi) - 12}px;width:${CARD_W + 24}px;height:${worldH}px"></div>`;
                    rb += `<div class="gen-head" style="left:${colX(gi)}px">Generation ${gi + 1}</div>`;
                }
            }
            for (const p of print ? [] : layout.rows) {
                const r = rects.get(p.key);
                const x1 = X(p.birth.t);
                const x2 = X(p.death ? p.death.t : now);
                const w = Math.max(x2 - x1, 2);
                const c = RIBBON_COLORS[p.gender];
                const fadeIn = p.birth.approx ? Math.min(40, w / 3) : 0;
                const fadeOut = p.death && p.death.approx ? Math.min(40, w / 3) : 0;
                const bg = `linear-gradient(to right, transparent 0, ${c} ${fadeIn}px, ${c} calc(100% - ${fadeOut}px), ${fadeOut ? 'transparent' : c} 100%)`;
                const clip = p.death ? '' : 'clip-path:polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%);';
                rb += `<div class="ribbon" style="left:${x1}px;top:${r.cy - RIBBON_H / 2}px;width:${w}px;background:${bg};${clip}"></div>`;
            }
            $('ribbons').innerHTML = rb;

            // Lines
            const L = computeLines();
            const svg = $('lines');
            svg.setAttribute('width', worldW);
            svg.setAttribute('height', worldH);
            let s = '';
            for (const pts of L.doubles) {
                const d = 'M' + pts.map(p => p.join(' ')).join(' L');
                s += `<path d="${d}" ${STROKE_DBL_OUTER}/><path d="${d}" ${STROKE_DBL_INNER}/>`;
            }
            for (const v of L.singles) s += `<path d="M${v.x} ${v.y1} V${v.y2}" ${STROKE_CONN}/>`;
            for (const h of L.segsH) s += `<path d="${hopPath(h, L.segsV)}" ${STROKE_CONN}${h.dashed ? ' stroke-dasharray="5 4"' : ''}/>`;
            svg.innerHTML = s;

            // Collapse / expand controls
            let c = '';
            for (const ctl of L.controls) {
                const key = escapeAttr(ctl.f.key);
                c += `<button class="toggle no-export" data-fam="${key}" style="left:${ctl.x}px;top:${ctl.y}px" title="${ctl.collapsed ? 'Expand' : 'Collapse'} this family">${ctl.collapsed ? '+' : '−'}</button>`;
                if (ctl.collapsed) {
                    const n = layout.famHidden.get(ctl.f.key) || 0;
                    const label = n ? `+${n} ${n === 1 ? 'person' : 'people'}` : 'collapsed';
                    c += `<span class="collapsed-label" style="left:${ctl.x}px;top:${ctl.y}px">${label}</span>`;
                }
            }
            $('controls').innerHTML = c;

            clampPan();
            applyTransform();
        }

        function escapeAttr(s) {
            return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
        }

        function clampPan() {
            const vw = view.clientWidth, vh = view.clientHeight;
            const sc = isPrint() ? printScale : 1;
            const ww = worldW * sc, wh = (layout ? layout.worldH : 0) * sc;
            tx = Math.min(60, Math.max(Math.min(0, vw - ww) - 60, tx));
            ty = Math.min(60, Math.max(Math.min(0, vh - wh) - 60, ty));
        }

        function applyTransform() {
            world.style.transform = `translate(${tx}px, ${ty}px)` + (isPrint() ? ` scale(${printScale})` : '');
            renderAxes();
        }

        function zoomAt(mx, factor, my = view.clientHeight / 2) {
            if (!model) return;
            if (isPrint()) {
                const wx = (mx - tx) / printScale, wy = (my - ty) / printScale;
                printScale = Math.min(2, Math.max(0.2, printScale * factor));
                tx = mx - wx * printScale;
                ty = my - wy * printScale;
                clampPan();
                applyTransform();
                return;
            }
            const t = (mx - tx - PAD_L) / ppy + startT;
            ppy = Math.min(MAX_PPY, Math.max(minPpy, ppy * factor));
            tx = mx - PAD_L - (t - startT) * ppy;
            render();
        }

        function fit() {
            if (!model) return;
            if (isPrint()) {
                render();   // computes worldW
                printScale = Math.min(1, Math.max(0.2, (view.clientWidth - 40) / worldW));
                tx = 0;
                ty = 0;
                clampPan();
                applyTransform();
                return;
            }
            const avail = view.clientWidth - PAD_L - BUF - CARD_W - 40;
            ppy = Math.min(MAX_PPY, Math.max(minPpy, avail / Math.max(endT - startT, 1)));
            tx = 0;
            ty = 0;
            render();
        }

        // ---------- Update from editor ----------
        let errorLine = null;
        function setStatus(cls, html) {
            const el = $('status');
            el.className = cls;
            el.innerHTML = html;
        }
        function esc(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function update() {
            const text = cm.getValue();
            if (!storeSet(STORE_KEY, text)) {
                // Still render; just warn below.
            }
            if (errorLine !== null) { cm.removeLineClass(errorLine, 'background', 'cm-error-line'); errorLine = null; }
            let m;
            try {
                const doc = csvToDoc(text);
                m = buildModel(doc);
                m.warnings.unshift(...doc.warnings);
            } catch (e) {
                if (typeof e.line === 'number') {
                    errorLine = cm.getLineHandle(e.line - 1);
                    if (errorLine) cm.addLineClass(errorLine, 'background', 'cm-error-line');
                }
                const where = typeof e.line === 'number' ? ` (line ${e.line})` : '';
                setStatus('error', `<b>Error${where}:</b> ${esc(e.message)}<br>Showing the last valid version of the tree.`);
                return;
            }
            showColumn();
            const first = !model;
            model = m;
            columns = computeColumns(m);
            const births = [...m.people.values()].map(p => p.birth.t);
            endT = todayT();
            startT = births.length ? Math.floor(Math.min(...births)) - 4 : endT - 50;
            buildCards();
            minPpy = computeMinPpy();
            if (ppy < minPpy) ppy = minPpy;
            relayoutRows();
            $('empty').hidden = m.people.size > 0;
            if (first) fit(); else render();

            const counts = `${m.people.size} people · ${m.families.length} families`;
            let saveNote = '';
            try { if (localStorage.getItem(STORE_KEY) !== text) saveNote = '<br>Too large to auto-save in this browser. Use <b>Save</b> to keep your changes.'; } catch { saveNote = '<br>Auto-save is unavailable in this browser. Use <b>Save</b> to keep your changes.'; }
            if (m.warnings.length) {
                setStatus('warn', `${counts} · ${m.warnings.length} warning${m.warnings.length > 1 ? 's' : ''}${saveNote}<ul>${m.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul>`);
            } else {
                setStatus(saveNote ? 'warn' : 'ok', `✓ ${counts}${saveNote}`);
            }
        }

        // ---------- Photos ----------
        function fileToPhoto(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    const w = img.naturalWidth, h = img.naturalHeight;
                    const s = Math.min(w, h);
                    const size = Math.min(256, s);
                    const canvas = document.createElement('canvas');
                    canvas.width = canvas.height = size;
                    // Square crop, biased towards the top of portrait photos where faces usually are.
                    canvas.getContext('2d').drawImage(img, (w - s) / 2, (h - s) * 0.3, s, s, 0, 0, size, size);
                    URL.revokeObjectURL(url);
                    resolve(canvas.toDataURL('image/jpeg', 0.85));
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that image.')); };
                img.src = url;
            });
        }

        let photoSaveWarned = false;
        async function setPhoto(key, data) {
            if (data) photos.set(key, data); else photos.delete(key);
            update();
            try {
                if (data) await photoStore.put(key, data); else await photoStore.del(key);
            } catch {
                if (!photoSaveWarned) alert('Photos cannot be stored in this browser, so they will be lost when the page closes. Use "Save with photos" to keep them.');
                photoSaveWarned = true;
            }
        }

        async function replacePhotos(map) {
            photos = map;
            try { await photoStore.replaceAll(map); } catch { }
        }

        async function handlePhotoFile(key, file) {
            if (!file || !file.type.startsWith('image/')) return;
            try { setPhoto(key, await fileToPhoto(file)); } catch (e) { alert(e.message); }
        }

        // ---------- Footer note ----------
        const FOOTER_KEY = 'familytree.footer';
        $('footerNote').value = loadJSON(FOOTER_KEY, '');
        $('footerNote').addEventListener('input', e => storeSet(FOOTER_KEY, JSON.stringify(e.target.value)));

        // Footer with the note on the left and the date on the right; null when no note is set.
        function makeFooter(verb) {
            const note = $('footerNote').value.trim();
            if (!note) return null;
            const d = new Date();
            const el = document.createElement('div');
            el.className = 'page-footer';
            const left = document.createElement('span');
            left.textContent = note;
            const right = document.createElement('span');
            right.textContent = `${verb} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
            el.append(left, right);
            return el;
        }

        // ---------- Export ----------
        async function exportImage(kind) {
            if (!model || !model.people.size) return;
            const axes = !isPrint();
            const w = Math.ceil(worldW);
            const stage = document.createElement('div');
            stage.className = 'export-stage';
            stage.style.width = w + 'px';
            const mkAxis = cls => {
                const a = document.createElement('div');
                a.className = `axis ${cls}`;
                a.style.width = w + 'px';
                a.innerHTML = axisHTML(0, w);
                return a;
            };
            const clone = world.cloneNode(true);
            clone.removeAttribute('id');
            clone.style.position = 'relative';
            clone.style.transform = 'none';
            if (axes) stage.append(mkAxis('top'), clone, mkAxis('bottom'));
            else stage.append(clone);
            if (!axes) stage.style.background = '#fff';
            const footer = makeFooter('Exported');
            if (footer) stage.append(footer);
            document.body.appendChild(stage);
            const h = Math.ceil(stage.getBoundingClientRect().height);
            document.body.style.cursor = 'progress';
            try {
                const ratio = Math.max(0.5, Math.min(2, 16000 / Math.max(w, h), Math.sqrt(120e6 / (w * h))));
                const opts = {
                    backgroundColor: axes ? getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#ffffff' : '#ffffff',
                    pixelRatio: ratio,
                    width: w,
                    height: h,
                    style: { position: 'static', left: '0', top: '0' },
                    imagePlaceholder: SILHOUETTE_URI,
                    skipFonts: true,
                    filter: n => !(n.classList && n.classList.contains('no-export')),
                };
                if (kind === 'png') {
                    download(await htmlToImage.toPng(stage, opts), 'family-tree.png');
                } else {
                    const canvas = await htmlToImage.toCanvas(stage, opts);
                    const { jsPDF } = window.jspdf;
                    const k = Math.min(0.75, 14000 / Math.max(w, h));   // px -> pt, within PDF page size limits
                    const pdf = new jsPDF({ orientation: w > h ? 'landscape' : 'portrait', unit: 'pt', format: [w * k, h * k] });
                    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, w * k, h * k);
                    pdf.save('family-tree.pdf');
                }
            } catch (e) {
                alert('Export failed: ' + (e && e.message ? e.message : e));
            } finally {
                stage.remove();
                document.body.style.cursor = '';
            }
        }

        function download(href, name) {
            const a = document.createElement('a');
            a.href = href;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        // ---------- Editor ----------
        // Colours each CSV column differently; the header row is bold and # lines are comments.
        CodeMirror.defineMode('csvcols', () => ({
            startState: () => ({ col: 0, inQuote: false, headerDone: false, inHeader: false }),
            copyState: st => ({ ...st }),
            token(stream, st) {
                if (stream.sol() && !st.inQuote) {
                    st.col = 0;
                    if (stream.match(/^\s*#/, false)) { stream.skipToEnd(); return 'comment'; }
                    st.inHeader = !st.headerDone;
                    st.headerDone = true;
                }
                const style = 'csv-c' + (st.col % 6) + (st.inHeader ? ' strong' : '');
                if (st.inQuote) {
                    while (!stream.eol()) {
                        if (stream.next() === '"') {
                            if (stream.peek() === '"') stream.next();
                            else { st.inQuote = false; break; }
                        }
                    }
                    return style;
                }
                const ch = stream.peek();
                if (ch === csvInfo.delim) { stream.next(); st.col++; return 'csv-sep'; }
                if (ch === '"') { stream.next(); st.inQuote = true; return style; }
                stream.eatWhile(c => c !== csvInfo.delim && c !== '"');
                return style;
            },
        }));
        const cm = CodeMirror($('editor'), {
            value: '',
            mode: 'csvcols',
            lineNumbers: true,
            tabSize: 4,
        });

        // Shows which column the cursor is in (only counts within the current line).
        function showColumn() {
            const { line, ch } = cm.getCursor();
            const text = cm.getLine(line).slice(0, ch);
            if (text.trimStart().startsWith('#')) { $('colInfo').textContent = ''; return; }
            let col = 0, inQ = false;
            for (const c of text) {
                if (c === '"') inQ = !inQ;
                else if (c === csvInfo.delim && !inQ) col++;
            }
            const name = csvInfo.cols[col];
            $('colInfo').textContent = name ? `Column: ${name} (${col + 1} of ${csvInfo.cols.length})` : `Column ${col + 1}`;
        }
        cm.on('cursorActivity', showColumn);
        let updateTimer = 0;
        cm.on('change', () => {
            clearTimeout(updateTimer);
            updateTimer = setTimeout(update, 300);
        });

        let jumpLine = null;
        function jumpToPerson(key) {
            const pane = $('editorPane');
            if (pane.classList.contains('hidden')) toggleEditor();
            const idCol = Math.max(0, csvInfo.cols.indexOf('id'));
            for (let i = 0; i < cm.lineCount(); i++) {
                const text = cm.getLine(i);
                if (text.trimStart().startsWith('#')) continue;
                const field = (text.split(csvInfo.delim)[idCol] || '').trim().replace(/^"|"$/g, '');
                if (field === key) {
                    if (jumpLine) cm.removeLineClass(jumpLine, 'background', 'cm-jump-line');
                    jumpLine = cm.getLineHandle(i);
                    cm.addLineClass(jumpLine, 'background', 'cm-jump-line');
                    cm.setCursor({ line: i, ch: cm.getLine(i).length });
                    cm.scrollIntoView({ line: i, ch: 0 }, 120);
                    cm.focus();
                    return;
                }
            }
        }

        // ---------- Interactions ----------
        let drag = null, pinch = null;
        const pointers = new Map();
        let renderQueued = false;
        const scheduleRender = () => {
            if (renderQueued) return;
            renderQueued = true;
            requestAnimationFrame(() => { renderQueued = false; render(); });
        };
        const pinchCenter = () => {
            const [a, b] = [...pointers.values()];
            const rect = view.getBoundingClientRect();
            return { x: (a.x + b.x) / 2 - rect.left, y: (a.y + b.y) / 2 - rect.top, dist: Math.hypot(a.x - b.x, a.y - b.y) || 1 };
        };
        view.addEventListener('pointerdown', e => {
            if (e.button !== 0 || e.target.closest('button, a, .photo')) return;
            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (pointers.size === 2 && model) {
                // Two fingers: pinch zooms the timeline around the point between them.
                const c = pinchCenter();
                pinch = { dist: c.dist, ppy, t: (c.x - tx - PAD_L) / ppy + startT, y: c.y, ty, scale: printScale, wx: (c.x - tx) / printScale, wy: (c.y - ty) / printScale };
                drag = null;
            } else if (pointers.size === 1) {
                drag = { x: e.clientX, y: e.clientY, tx, ty, moved: false };
            }
        });
        view.addEventListener('pointermove', e => {
            if (!pointers.has(e.pointerId)) return;
            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (pinch && pointers.size >= 2) {
                const c = pinchCenter();
                if (isPrint()) {
                    printScale = Math.min(2, Math.max(0.2, pinch.scale * c.dist / pinch.dist));
                    tx = c.x - pinch.wx * printScale;
                    ty = c.y - pinch.wy * printScale;
                    applyTransform();
                    return;
                }
                ppy = Math.min(MAX_PPY, Math.max(minPpy, pinch.ppy * c.dist / pinch.dist));
                tx = c.x - PAD_L - (pinch.t - startT) * ppy;
                ty = pinch.ty + (c.y - pinch.y);
                scheduleRender();
                return;
            }
            if (!drag) return;
            const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
            if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 3) {
                drag.moved = true;
                try { view.setPointerCapture(e.pointerId); } catch { }
                view.classList.add('dragging');
            }
            if (!drag.moved) return;
            tx = drag.tx + dx;
            ty = drag.ty + dy;
            clampPan();
            applyTransform();
        });
        const endDrag = e => {
            pointers.delete(e.pointerId);
            if (pinch && pointers.size === 1) {
                // One finger lifted after a pinch: keep panning with the other.
                const [p] = pointers.values();
                drag = { x: p.x, y: p.y, tx, ty, moved: true };
            } else if (!pointers.size) {
                drag = null;
                view.classList.remove('dragging');
            }
            if (pointers.size < 2) pinch = null;
        };
        view.addEventListener('pointerup', endDrag);
        view.addEventListener('pointercancel', endDrag);

        view.addEventListener('wheel', e => {
            if (!model) return;
            e.preventDefault();
            const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? view.clientHeight : 1;
            if (e.ctrlKey || e.metaKey) {
                const rect = view.getBoundingClientRect();
                zoomAt(e.clientX - rect.left, Math.exp(-e.deltaY * unit * 0.0025), e.clientY - rect.top);
            } else {
                tx -= (e.shiftKey ? e.deltaY : e.deltaX) * unit;
                ty -= (e.shiftKey ? 0 : e.deltaY) * unit;
                clampPan();
                applyTransform();
            }
        }, { passive: false });

        $('controls').addEventListener('click', e => {
            const b = e.target.closest('.toggle');
            if (!b) return;
            const key = b.dataset.fam;
            if (collapsed.has(key)) collapsed.delete(key); else collapsed.add(key);
            storeSet(COLLAPSE_KEY, JSON.stringify([...collapsed]));
            relayoutRows();
            render();
        });

        const cardsLayer = $('cards');
        cardsLayer.addEventListener('click', e => {
            const rm = e.target.closest('.photo-remove');
            if (rm) { setPhoto(rm.dataset.remove, null); return; }
            const photo = e.target.closest('.photo');
            if (photo) {
                photoTarget = photo.closest('.card').dataset.key;
                $('filePhoto').value = '';
                $('filePhoto').click();
            }
        });
        cardsLayer.addEventListener('dblclick', e => {
            const card = e.target.closest('.card');
            if (card && !e.target.closest('.photo, .photo-remove')) jumpToPerson(card.dataset.key);
        });
        cardsLayer.addEventListener('dragover', e => {
            const card = e.target.closest('.card');
            if (!card || !e.dataTransfer.types.includes('Files')) return;
            e.preventDefault();
            cardsLayer.querySelectorAll('.card.drop').forEach(c => c !== card && c.classList.remove('drop'));
            card.classList.add('drop');
        });
        cardsLayer.addEventListener('dragleave', e => {
            const card = e.target.closest('.card');
            if (card && !card.contains(e.relatedTarget)) card.classList.remove('drop');
        });
        cardsLayer.addEventListener('drop', e => {
            const card = e.target.closest('.card');
            if (!card) return;
            e.preventDefault();
            card.classList.remove('drop');
            handlePhotoFile(card.dataset.key, e.dataTransfer.files[0]);
        });
        $('filePhoto').addEventListener('change', e => {
            if (photoTarget) handlePhotoFile(photoTarget, e.target.files[0]);
        });

        $('btnOpen').onclick = () => { $('fileOpen').value = ''; $('fileOpen').click(); };
        $('fileOpen').addEventListener('change', async e => {
            const f = e.target.files[0];
            if (!f) return;
            try { await openFile(f); } catch (err) { alert('Could not open that file: ' + err.message); }
        });

        function setEditorText(text, fileName) {
            currentFileName = fileName.replace(/\.[^.]*$/, '') + '.csv';
            cm.setValue(text);
            cm.clearHistory();
            clearTimeout(updateTimer);
            update();
            fit();
        }

        async function openFile(f) {
            if (/\.zip$/i.test(f.name)) {
                // A .zip from "Save with photos": the .csv plus photos/<id>.<ext>. Replaces the photos in this browser.
                const zip = await JSZip.loadAsync(f);
                const entries = Object.values(zip.files).filter(z => !z.dir && !z.name.includes('__MACOSX'));
                const csvFile = entries.find(z => /\.(csv|tsv|txt)$/i.test(z.name));
                if (!csvFile) throw new Error('there is no .csv file inside the zip.');
                const mimes = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif' };
                const map = new Map();
                for (const z of entries) {
                    const m = /(?:^|\/)photos\/([^/]+)\.(jpe?g|png|webp|gif)$/i.exec(z.name);
                    if (!m) continue;
                    let key = m[1];
                    try { key = decodeURIComponent(key); } catch { }
                    map.set(key, `data:${mimes[m[2].toLowerCase()]};base64,` + await z.async('base64'));
                }
                await replacePhotos(map);
                setEditorText(await csvFile.async('string'), csvFile.name.split('/').pop());
            } else if (/\.ya?ml$/i.test(f.name)) {
                // Config from the earlier YAML version: convert it, keeping any embedded photos.
                const r = yamlToCsv(jsyaml.load(await f.text(), { schema: jsyaml.CORE_SCHEMA }));
                for (const [k, v] of r.photos) { photos.set(k, v); photoStore.put(k, v).catch(() => { }); }
                setEditorText(r.text, f.name);
            } else {
                setEditorText(await f.text(), f.name);
            }
        }

        $('btnSave').onclick = () => {
            const url = URL.createObjectURL(new Blob([cm.getValue()], { type: 'text/csv' }));
            download(url, currentFileName);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        };
        $('btnSaveZip').onclick = async () => {
            const zip = new JSZip();
            zip.file(currentFileName, cm.getValue());
            const exts = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif' };
            for (const [k, v] of photos) {
                const m = /^data:([^;]+);base64,(.*)$/.exec(v);
                if (m) zip.file(`photos/${encodeURIComponent(k)}.${exts[m[1]] || 'jpg'}`, m[2], { base64: true });
            }
            const url = URL.createObjectURL(await zip.generateAsync({ type: 'blob' }));
            download(url, currentFileName.replace(/\.csv$/i, '') + '.zip');
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        };
        $('btnReset').onclick = () => {
            if (!confirm('Replace the editor contents with the sample tree? Anything you have not saved will be lost.')) return;
            setEditorText(SAMPLE, 'family-tree.csv');
        };
        $('btnZoomIn').onclick = () => zoomAt(view.clientWidth / 2, 1.25);
        $('btnZoomOut').onclick = () => zoomAt(view.clientWidth / 2, 0.8);
        $('btnFit').onclick = fit;
        $('viewMode').onchange = e => {
            viewMode = e.target.value;
            storeSet(DENSITY_KEY, JSON.stringify(viewMode));
            applyViewMode();
            if (!model) return;
            buildCards();
            minPpy = computeMinPpy();
            relayoutRows();
            fit();
        };
        $('btnPng').onclick = () => exportImage('png');
        $('btnPdf').onclick = () => exportImage('pdf');
        $('btnPrint').onclick = () => window.print();

        // Printing: scale the tree to the page width; wide trees print in landscape.
        let printPageStyle = null;
        window.addEventListener('beforeprint', () => {
            if (!model) return;
            const landscape = worldW > 760;
            const pageW = landscape ? 1020 : 700;   // printable width in CSS px (A4/Letter, 10mm margins)
            document.documentElement.style.setProperty('--print-zoom', Math.min(1, pageW / worldW));
            const footer = makeFooter('Printed');
            $('printFooter').replaceChildren(...(footer ? footer.childNodes : []));
            printPageStyle = document.createElement('style');
            printPageStyle.textContent = `@page { size: ${landscape ? 'landscape' : 'portrait'}; margin: 10mm; }`;
            document.head.appendChild(printPageStyle);
        });
        window.addEventListener('afterprint', () => {
            if (printPageStyle) printPageStyle.remove();
            printPageStyle = null;
        });

        function toggleEditor() {
            const hide = !$('editorPane').classList.contains('hidden');
            $('editorPane').classList.toggle('hidden', hide);
            $('divider').classList.toggle('hidden', hide);
            $('btnToggleEditor').textContent = hide ? 'Show editor' : 'Hide editor';
            if (!hide) cm.refresh();
        }
        $('btnToggleEditor').onclick = toggleEditor;
        if (window.innerWidth < 900) toggleEditor();

        // Resizable editor pane
        $('divider').addEventListener('pointerdown', e => {
            const d = $('divider');
            d.setPointerCapture(e.pointerId);
            const move = ev => {
                $('editorPane').style.width = Math.max(240, Math.min(window.innerWidth - 300, ev.clientX)) + 'px';
            };
            const up = () => {
                d.removeEventListener('pointermove', move);
                d.removeEventListener('pointerup', up);
                cm.refresh();
            };
            d.addEventListener('pointermove', move);
            d.addEventListener('pointerup', up);
        });

        new ResizeObserver(() => { if (model) { clampPan(); applyTransform(); } }).observe(view);

        (async () => {
            try { photos = await photoStore.loadAll(); } catch { }
            let text = null;
            try { text = localStorage.getItem(STORE_KEY); } catch { }
            if (text == null) {
                // One-time migration from the earlier YAML version of this page.
                let old = null;
                try { old = localStorage.getItem(OLD_YAML_KEY); } catch { }
                if (old) {
                    try {
                        const r = yamlToCsv(jsyaml.load(old, { schema: jsyaml.CORE_SCHEMA }));
                        text = r.text;
                        for (const [k, v] of r.photos) { photos.set(k, v); photoStore.put(k, v).catch(() => { }); }
                    } catch { }
                }
            }
            cm.setValue(text ?? SAMPLE);
            cm.clearHistory();
            clearTimeout(updateTimer);
            update();
        })();
    </script>
</body>

</html>
